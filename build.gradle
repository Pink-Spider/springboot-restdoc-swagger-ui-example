buildscript {
    ext {
        restdocsApiSpecVersion = '0.20.2'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'

    id 'com.epages.restdocs-api-spec' version "${restdocsApiSpecVersion}"
}

group = 'io.pinkspider'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.modelmapper:modelmapper:3.2.7'
    implementation 'tools.jackson.module:jackson-module-mrbean'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation "com.epages:restdocs-api-spec-mockmvc:${restdocsApiSpecVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openapi3 {
    server = "http://localhost:8082"
    title = getRootProject().name + " API 문서"
    description = getRootProject().name + "API 문서 입니다. 작성된 테스트 코드 기반으로 생성됩니다. 삭제와 생성이 자동화 되었습니다."
    version = getVersion()
    // processResources 출력(build/resources/main)과 겹치면 copyJson 이 생성된 파일을 인식하지 못한다(NO-SOURCE).
    outputDirectory = "build/api-spec"
    outputFileNamePrefix = getRootProject().name + "-api"
    format = 'json'
}

tasks.register('copyJson', Copy) {
    from layout.buildDirectory.dir("api-spec")
    include getRootProject().name + "-api.json"
    into "src/main/resources/restdocs"
    dependsOn('openapi3')
}

build {
    finalizedBy copyJson
}

clean {
    delete "src/main/resources/restdocs/" + getRootProject().name + "-api.json"
}

tasks.named('test') {
    systemProperty 'file.encoding', 'UTF-8'
    useJUnitPlatform()
}
